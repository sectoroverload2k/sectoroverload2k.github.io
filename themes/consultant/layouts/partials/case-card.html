<a href="{{ .RelPermalink }}" class="card case-card">
  <div class="case-banner"><i class="bi bi-{{ .Params.icon | default "diagram-3" }}"></i><span>{{ .Params.industry }}</span></div>
  <div class="case-body">
    <h3>{{ .Title }}</h3>
    <p>{{ .Params.summary }}</p>
    <span class="text-link">Read case study <i class="bi bi-arrow-right"></i></span>
  </div>
</a>
